name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: mojeeeb/smartops-bot:latest

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mojeeeb/smartops-bot:latest
          format: "table"
          exit-code: "0"
          ignore-unfixed: true

      - name: Commit updated values.yaml (optional)
        run: |
          sed -i "s/tag: .*/tag: latest/" helm/smartops/values.yaml
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          git add helm/smartops/values.yaml
          git commit -m "Update image tag to latest" || echo "No changes"
          git push

      # Argo CD handles the deployment from repo → cluster
