apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartops
  namespace: smartops
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: smartops
  template:
    metadata:
      labels:
        app: smartops
    spec:
      containers:
      - name: bot
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: N8N_WEBHOOK_URL
          value: {{ .Values.n8n.webhookUrl | quote }}
        - name: SCAN_INTERVAL
          value: "300"
        volumeMounts:
        - name: trivy-results
          mountPath: /data
      volumes:
      - name: trivy-results
        emptyDir: {}
